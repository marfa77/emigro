# Deploy Emigro VPS Threads from git checkout on the VPS runner.
# Requires a self-hosted runner labeled [self-hosted, linux, vps] registered
# to marfa77/emigro (same machine as /opt/emigro). Until then use:
#   bash scripts/deploy_vps_from_git.sh
name: Deploy VPS Threads

on:
  workflow_dispatch:
  # Uncomment after an emigro self-hosted runner is registered:
  # push:
  #   branches: [main]
  #   paths:
  #     - "lib/threads/**"
  #     - "scripts/threads-*.ts"
  #     - "scripts/deploy_vps_from_git.sh"
  #     - "scripts/deploy_on_vps_runner.sh"
  #     - "deploy/threads-*/**"
  #     - "deploy/systemd/emigro-threads-*"
  #     - "package.json"
  #     - "package-lock.json"
  #     - ".github/workflows/deploy-vps-threads.yml"

jobs:
  deploy:
    runs-on: [self-hosted, linux, vps]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Threads from this checkout → /opt/emigro
        run: bash scripts/deploy_on_vps_runner.sh
