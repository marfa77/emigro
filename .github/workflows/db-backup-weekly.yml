# Weekly logical backup stored outside Supabase (GitHub Actions artifact, 90 days).
# Setup: add repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
# Manual run: Actions → Weekly database backup → Run workflow
name: Weekly database backup

on:
  schedule:
    # Sunday 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: db-backup-weekly
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump linked database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p backups
          STAMP="$(date -u +%Y%m%d)"
          OUT="backups/emigro-${STAMP}.sql"
          supabase link --project-ref wcwadwcjqutdxwbrkyai --password "$SUPABASE_DB_PASSWORD" --yes
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f "$OUT"
          gzip -9 "$OUT"
          ls -lh backups/

      - uses: actions/upload-artifact@v4
        with:
          name: emigro-db-${{ github.run_number }}
          path: backups/*.sql.gz
          retention-days: 90
          if-no-files-found: error
